<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" viewBox="0 0 700 200">
  <style>
    * {
      font-family: 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
    }
    .bg { fill: #282a36; }           /* bg-base-100 */
    .text-base { fill: #ffb86c; }    /* base-content */
    .text-secondary { fill: #ff79c6; } /* secondary */
    .icon { fill: #6272a4; }         /* neutral */
    .accent { fill: #bd93f9; stroke: #bd93f9; } /* accent */
  </style>

  <rect x="1" y="1" rx="5" ry="5" height="99%" width="99.714%" stroke="#282a36" stroke-width="1" class="bg" stroke-opacity="1"></rect>
  <text x="30" y="40" style="font-size: 22px;" class="text-secondary">S44r4h</text>

  <!-- Esimerkki ikonista -->
  <g transform="translate(30,70)">
    <circle cx="10" cy="10" r="8" class="icon" />
  </g>

  <!-- Tekstit -->
  <text x="30" y="100" class="text-base" style="font-size: 14px;">749 Contributions on GitHub</text>
  <text x="30" y="120" class="text-base" style="font-size: 14px;">9 Public Repos</text>
  <text x="30" y="140" class="text-base" style="font-size: 14px;">Joined GitHub 4 years ago</text>

  <!-- Korostusviiva -->
  <path d="M0,180 C100,150 300,150 700,180" class="accent" opacity="1" />
</svg>
